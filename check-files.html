<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akram · File check</title><style>body{background:#10261f;color:#eee7d5;font:17px system-ui;max-width:850px;margin:60px auto;padding:24px}a{color:#ded0a7}li{padding:7px}button{padding:12px 22px;cursor:pointer}h1{font-family:Georgia}#summary{padding:20px;border:1px solid #788777}</style><a href="index.html">← Akram Library</a><h1>Website file check / Hubinta faylasha</h1><p>This checks whether the images, books and reader files were uploaded. / Waxaa la hubinayaa in sawirrada, buugaagta iyo faylasha akhrisku wada jiraan.</p><button onclick="location.reload()">Check again / Mar kale hubi</button><p id="summary" role="status">Checking… / Waa la hubinayaa…</p><ul id="results"></ul><script>
(async()=>{let files=['assets--library.webp','assets--akram-logo.png','assets--pdf.mjs','assets--pdf.worker.mjs','app.js','read.js','style.css','reading-room.css','locale.js','catalog.json'];try{const r=await fetch('catalog.json',{cache:'no-store'});if(!r.ok)throw Error();for(const b of await r.json())for(const k of ['cover','text','pdf'])if(b[k]&&!b[k].startsWith('http'))files.push(b[k])}catch{}files=[...new Set(files)];let failed=[];await Promise.all(files.map(async f=>{try{const r=await fetch(f,{method:'HEAD',cache:'no-store'});if(!r.ok)failed.push(f)}catch{failed.push(f)}}));document.querySelector('#summary').textContent=failed.length?`${failed.length} files missing / fayl ayaa maqan. Upload these files beside index.html:`:`All ${files.length} files are available / Dhammaan faylasha waa diyaar.`;for(const f of failed){const li=document.createElement('li');li.textContent=f;document.querySelector('#results').append(li)}})();</script></html>
